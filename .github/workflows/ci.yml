name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff==0.17.5
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Lightweight install: tests inject fakes rather than loading ML models.
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing
      - run: python scripts/run_demo.py --no-output
      - run: python scripts/run_synthetic_evaluation.py
      - run: mypy meeting_intel
        if: matrix.python-version == '3.12'
